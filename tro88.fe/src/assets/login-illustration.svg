<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F0" />
      <stop offset="100%" stop-color="#EEF4FF" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4845F" />
      <stop offset="100%" stop-color="#F25C37" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF" />
      <stop offset="100%" stop-color="#3B6DD2" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6C8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F4845F" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glow Shapes -->
  <circle cx="150" cy="150" r="100" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="350" cy="350" r="120" fill="#E8EFFF" filter="url(#glow)" />

  <!-- Decorative Grid / Dots -->
  <g opacity="0.25">
    <circle cx="50" cy="50" r="2" fill="#F4845F" />
    <circle cx="100" cy="50" r="2" fill="#F4845F" />
    <circle cx="150" cy="50" r="2" fill="#F4845F" />
    <circle cx="50" cy="100" r="2" fill="#F4845F" />
    <circle cx="100" cy="100" r="2" fill="#F4845F" />
    <circle cx="150" cy="100" r="2" fill="#F4845F" />
  </g>

  <!-- The Smart Phone / Portal Frame -->
  <g transform="translate(110, 80)">
    <!-- Device Body Shadow -->
    <rect x="5" y="5" width="280" height="340" rx="32" fill="#2D2D2D" opacity="0.08" />
    <!-- Device Body -->
    <rect width="280" height="340" rx="32" fill="#FFFFFF" stroke="#F0EBE3" stroke-width="2" />
    <!-- Screen Inner Area -->
    <rect x="12" y="12" width="256" height="316" rx="20" fill="#FAF6F2" />

    <!-- Screen Mock UI Elements -->
    <!-- App Header -->
    <rect x="32" y="32" width="40" height="8" rx="4" fill="#E8E0D8" />
    <circle cx="230" cy="36" r="6" fill="#F4845F" />
    
    <!-- Large Card on screen -->
    <rect x="32" y="60" width="216" height="110" rx="16" fill="#FFFFFF" stroke="#F0EBE3" stroke-dasharray="2,2" />
    <path d="M 44,130 A 28,28 0 0,1 100,130" fill="none" stroke="#F4845F" stroke-width="4" stroke-linecap="round" />
    <!-- Small UI bars representing data -->
    <rect x="32" y="190" width="160" height="10" rx="5" fill="#E8E0D8" />
    <rect x="32" y="210" width="110" height="8" rx="4" fill="#F0EBE3" />
    
    <!-- Status Indicator Pill -->
    <rect x="32" y="240" width="80" height="20" rx="10" fill="#FEF0EB" />
    <text x="72" y="254" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#F4845F" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Overlapping House Graphic -->
  <g transform="translate(60, 200)">
    <!-- Shadow -->
    <path d="M10 90 L80 20 L150 90 Z" fill="#2D2D2D" opacity="0.05" transform="translate(5, 5)" />
    <!-- House Structure -->
    <path d="M 10 90 L 80 20 L 150 90 Z" fill="url(#primaryGrad)" />
    <rect x="30" y="90" width="100" height="80" rx="8" fill="url(#primaryGrad)" />
    <!-- House Door -->
    <rect x="65" y="120" width="30" height="50" rx="4" fill="#FFFFFF" />
    <!-- Window -->
    <circle cx="80" cy="65" r="14" fill="#FFFFFF" opacity="0.9" />
    <line x1="80" y1="51" x2="80" y2="79" stroke="#F4845F" stroke-width="2" />
    <line x1="66" y1="65" x2="94" y2="65" stroke="#F4845F" stroke-width="2" />
  </g>

  <!-- Secure Key Graphic (Floating) -->
  <g transform="translate(250, 160)" filter="url(#glow)">
    <g transform="rotate(-15)">
      <!-- Key Shadow -->
      <circle cx="42" cy="42" r="30" fill="#2C3E50" opacity="0.1" transform="translate(3,3)" />
      <!-- Key Ring (Head) -->
      <circle cx="40" cy="40" r="25" fill="none" stroke="url(#secondaryGrad)" stroke-width="10" />
      <circle cx="40" cy="40" r="12" fill="#FFFFFF" />
      <!-- Key Shaft -->
      <rect x="65" y="35" width="80" height="10" rx="3" fill="url(#secondaryGrad)" />
      <!-- Key Teeth -->
      <rect x="115" y="45" width="12" height="15" rx="2" fill="url(#secondaryGrad)" />
      <rect x="133" y="45" width="12" height="12" rx="2" fill="url(#secondaryGrad)" />
    </g>
  </g>

  <!-- Sparkles/Stars (Visual highlights) -->
  <g fill="#FFD43B" transform="translate(380, 80)">
    <path d="M 0 10 L 4 4 L 10 0 L 4 -4 L 0 -10 L -4 -4 L -10 0 L -4 4 Z" />
  </g>
  <g fill="#FFD43B" transform="translate(80, 360)">
    <path d="M 0 6 L 2 2 L 6 0 L 2 -2 L 0 -6 L -2 -2 L -6 0 L -2 2 Z" />
  </g>
</svg>
